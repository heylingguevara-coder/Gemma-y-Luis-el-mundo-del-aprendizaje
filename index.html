
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mi Mundo Feliz Virtual</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#bdeaff;
 color:#62436d;
 text-align:center;
 overflow-x:hidden;
}
header{
 background:#ff83c1;
 color:white;
 padding:12px;
 font-size:23px;
 font-weight:bold;
}
#top{
 display:flex;
 justify-content:space-around;
 align-items:center;
 padding:8px;
 background:white;
 font-weight:bold;
}
#game{
 width:100%;
 max-width:950px;
 margin:auto;
 position:relative;
}
canvas{
 display:block;
 width:100%;
 height:auto;
 background:#a9e8a0;
 touch-action:none;
}
#controls{
 display:grid;
 grid-template-columns:repeat(3,65px);
 justify-content:center;
 gap:5px;
 padding:8px;
}
.move{
 background:#a47be9;
 color:white;
 font-size:24px;
 height:52px;
 border-radius:15px;
 border:0;
 touch-action:none;
}
#bottom{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:5px;
 padding:10px;
 background:white;
}
button{
 border:0;
 border-radius:15px;
 padding:11px;
 background:#ff8ac4;
 color:white;
 font-weight:bold;
 font-size:14px;
}
button:active{transform:scale(.95)}
#wardrobe,#activity{
 background:white;
 padding:16px;
 margin:10px;
 border-radius:20px;
}
.hidden{display:none!important}
#message{
 position:absolute;
 top:10px;
 left:5%;
 width:90%;
 background:#ffffffed;
 border-radius:18px;
 padding:12px;
 font-weight:bold;
 display:none;
}
.option{margin:4px}
.small{font-size:12px}
</style>
</head>

<body>

<header>🌈 MI MUNDO FELIZ 🌈</header>

<div id="top">
 <span>⭐ <span id="stars">0</span></span>
 <span id="playerLabel">Mi personaje</span>
 <span>🏡 Mundo virtual</span>
</div>

<div id="game">
 <canvas id="world" width="900" height="580"></canvas>
 <div id="message"></div>
</div>

<div id="controls">
 <div></div>
 <button class="move" id="up">⬆️</button>
 <div></div>
 <button class="move" id="left">⬅️</button>
 <button class="move" id="down">⬇️</button>
 <button class="move" id="right">➡️</button>
</div>

<div id="bottom">
 <button onclick="changeWorld('town')">🏡 Ciudad</button>
 <button onclick="changeWorld('park')">🌳 Parque</button>
 <button onclick="changeWorld('farm')">🐮 Granja</button>
 <button onclick="changeWorld('school')">🏫 Escuela</button>
 <button onclick="openWardrobe()">👗 Vestidor</button>
 <button onclick="interact()">👆 Interactuar</button>
</div>

<section id="wardrobe" class="hidden">
<h2>👗 MI VESTIDOR</h2>
<div style="font-size:65px" id="preview">👧🏻</div>

<h3>Personaje</h3>
<button onclick="setCharacter('👧🏻')">👧🏻</button>
<button onclick="setCharacter('👦🏻')">👦🏻</button>
<button onclick="setCharacter('🧒🏻')">🧒🏻</button>
<button onclick="setCharacter('👩🏽')">👩🏽</button>

<h3>Color de ropa</h3>
<button style="background:#3485e9" onclick="setClothes('#3485e9')">Azul</button>
<button style="background:#36a85b" onclick="setClothes('#36a85b')">Verde</button>
<button style="background:#e94444" onclick="setClothes('#e94444')">Rojo</button>
<button style="background:#ee83bd" onclick="setClothes('#ee83bd')">Rosa</button>
<button style="background:#9a60d7" onclick="setClothes('#9a60d7')">Morado</button>
<button style="background:#e8c63c" onclick="setClothes('#e8c63c')">Amarillo</button>

<h3>Cabello</h3>
<button onclick="setHair('#44251e')">Café</button>
<button onclick="setHair('#171717')">Negro</button>
<button onclick="setHair('#e5a52c')">Rubio</button>
<button onclick="setHair('#c94b8c')">Rosa</button>

<h3>Accesorios</h3>
<button onclick="setAccessory('🎀')">🎀</button>
<button onclick="setAccessory('👑')">👑</button>
<button onclick="setAccessory('⭐')">⭐</button>
<button onclick="setAccessory('🕶️')">🕶️</button>

<br><br>
<button onclick="saveAvatar()">💾 GUARDAR</button>
<button onclick="closeWardrobe()">VOLVER AL MUNDO</button>
</section>

<section id="activity" class="hidden">
<h2 id="activityTitle">¡Vamos a aprender!</h2>
<p id="activityQuestion"></p>
<div id="activityAnswers"></div>
<p id="activityMessage"></p>
<button onclick="closeActivity()">VOLVER AL MUNDO</button>
</section>

<script>
const canvas=document.getElementById("world");
const ctx=canvas.getContext("2d");

let player={
 x:450,y:310,
 face:"👧🏻",
 clothes:"#ee83bd",
 hair:"#44251e",
 accessory:""
};

let stars=0;
let world="town";
let keys={};
let activityOpen=false;

const locations={
 town:[
  {x:110,y:120,w:180,h:130,name:"Mi casa",icon:"🏡",color:"#ffb1ca",type:"home"},
  {x:610,y:100,w:180,h:130,name:"Tienda",icon:"🏪",color:"#ffdf91",type:"shop"},
  {x:350,y:390,w:190,h:120,name:"Parque",icon:"🌳",color:"#a2d8ff",type:"park"}
 ],
 park:[
  {x:90,y:100,w:180,h:140,name:"Zona de juegos",icon:"🛝",color:"#ffca91",type:"play"},
  {x:600,y:100,w:180,h:140,name:"Animales",icon:"🐰",color:"#c5edaa",type:"animals"}
 ],
 farm:[
  {x:90,y:100,w:180,h:140,name:"Establo",icon:"🐮",color:"#f5c98b",type:"animals"},
  {x:610,y:100,w:180,h:140,name:"Gallinero",icon:"🐔",color:"#ffdf91",type:"animals"}
 ],
 school:[
  {x:320,y:100,w:250,h:160,name:"Salón de clases",icon:"🏫",color:"#ffb6ca",type:"school"},
  {x:620,y:370,w:160,h:110,name:"Biblioteca",icon:"📚",color:"#a9d8ff",type:"letters"}
 ]
};

function background(){
 ctx.fillStyle=world==="school"?"#a8d9ed":"#91d98c";
 ctx.fillRect(0,0,900,580);

 // Caminos
 ctx.fillStyle="#e9d4a9";
 ctx.beginPath();
 ctx.moveTo(0,280);
 ctx.lineTo(900,280);
 ctx.lineTo(900,360);
 ctx.lineTo(0,360);
 ctx.fill();

 ctx.beginPath();
 ctx.moveTo(390,0);
 ctx.lineTo(490,0);
 ctx.lineTo(490,580);
 ctx.lineTo(390,580);
 ctx.fill();

 // Flores
 for(let i=0;i<35;i++){
  let x=(i*137+45)%880;
  let y=(i*79+30)%550;
  if(y>265&&y<370)continue;
  ctx.fillStyle=["#ff78bb","#fff17a","#ffffff","#bd91ff"][i%4];
  ctx.beginPath();
  ctx.arc(x,y,5,0,Math.PI*2);
  ctx.fill();
 }
}

function drawBuilding(b){
 ctx.fillStyle="#00000022";
 ctx.fillRect(b.x+8,b.y+10,b.w,b.h);
 ctx.fillStyle=b.color;
 ctx.fillRect(b.x,b.y,b.w,b.h);

 ctx.fillStyle="#fff";
 ctx.fillRect(b.x+20,b.y+20,b.w-40,40);

 ctx.font="34px Arial";
 ctx.textAlign="center";
 ctx.fillText(b.icon,b.x+b.w/2,b.y+48);

 ctx.fillStyle="#65436d";
 ctx.font="bold 18px Arial";
 ctx.fillText(b.name,b.x+b.w/2,b.y+b.h-20);

 ctx.fillStyle="#9b674d";
 ctx.fillRect(b.x+b.w/2-18,b.y+b.h-55,36,55);
}

function drawPlayer(){
 ctx.save();
 ctx.translate(player.x,player.y);

 // Sombra
 ctx.fillStyle="#00000025";
 ctx.beginPath();
 ctx.ellipse(0,28,25,9,0,0,Math.PI*2);
 ctx.fill();

 // Cuerpo
 ctx.fillStyle=player.clothes;
 ctx.beginPath();
 ctx.roundRect(-17,-5,34,40,10);
 ctx.fill();

 // Brazos
 ctx.strokeStyle="#f1c39f";
 ctx.lineWidth=10;
 ctx.lineCap="round";
 ctx.beginPath();
 ctx.moveTo(-15,2);ctx.lineTo(-26,20);
 ctx.moveTo(15,2);ctx.lineTo(26,20);
 ctx.stroke();

 // Piernas
 ctx.strokeStyle="#554a80";
 ctx.lineWidth=9;
 ctx.beginPath();
 ctx.moveTo(-8,30);ctx.lineTo(-9,44);
 ctx.moveTo(8,30);ctx.lineTo(9,44);
 ctx.stroke();

 // Cabeza
 ctx.fillStyle="#f5c8a6";
 ctx.beginPath();
 ctx.arc(0,-22,23,0,Math.PI*2);
 ctx.fill();

 // Cabello
 ctx.fillStyle=player.hair;
 ctx.beginPath();
 ctx.arc(0,-31,24,Math.PI,Math.PI*2);
 ctx.fill();
 ctx.fillRect(-23,-33,8,17);

 // Ojos
 ctx.fillStyle="#42302c";
 ctx.beginPath();
 ctx.arc(-8,-22,2.5,0,Math.PI*2);
 ctx.arc(8,-22,2.5,0,Math.PI*2);
 ctx.fill();

 // Sonrisa
 ctx.strokeStyle="#b66b69";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(0,-17,7,0.15,Math.PI-0.15);
 ctx.stroke();

 ctx.font="22px Arial";
 ctx.textAlign="center";
 ctx.fillText(player.accessory,0,-52);

 ctx.restore();
}

function draw(){
 background();

 (locations[world]||[]).forEach(drawBuilding);

 if(world==="farm"){
  ctx.font="45px Arial";
  ctx.fillText("🐄",280,460);
  ctx.fillText("🐓",720,475);
  ctx.fillText("🐑",130,480);
 }
 if(world==="park"){
  ctx.font="45px Arial";
  ctx.fillText("🌳",100,450);
  ctx.fillText("🌳",770,450);
  ctx.fillText("🦋",520,120);
 }
 if(world==="town"){
  ctx.font="40px Arial";
  ctx.fillText("🚗",550,450);
  ctx.fillText("🌷",100,460);
 }
 if(world==="school"){
  ctx.font="40px Arial";
  ctx.fillText("✏️",180,440);
  ctx.fillText("📖",700,140);
 }

 drawPlayer();
 requestAnimationFrame(draw);
}

function move(dx,dy){
 if(activityOpen)return;
 player.x=Math.max(28,Math.min(872,player.x+dx));
 player.y=Math.max(60,Math.min(540,player.y+dy));
}

function loopMovement(){
 if(keys.up)move(0,-3);
 if(keys.down)move(0,3);
 if(keys.left)move(-3,0);
 if(keys.right)move(3,0);
 requestAnimationFrame(loopMovement);
}

function bindMove(id,key){
 let b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
 });
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>{
  b.addEventListener(ev,()=>keys[key]=false);
 });
}

bindMove("up","up");
bindMove("down","down");
bindMove("left","left");
bindMove("right","right");

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowUp"||e.key==="w")keys.up=true;
 if(e.key==="ArrowDown"||e.key==="s")keys.down=true;
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
 if(e.key===" "||e.key==="Enter")interact();
});

document.addEventListener("keyup",e=>{
 if(e.key==="ArrowUp"||e.key==="w")keys.up=false;
 if(e.key==="ArrowDown"||e.key==="s")keys.down=false;
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});

function changeWorld(name){
 world=name;
 player.x=450;
 player.y=310;
 closeActivity();
 closeWardrobe();
 speak("Bienvenido a "+name);
}

function nearest(){
 return (locations[world]||[]).find(b=>{
  let cx=b.x+b.w/2;
  let cy=b.y+b.h/2;
  return Math.hypot(player.x-cx,player.y-cy)<145;
 });
}

function interact(){
 let b=nearest();
 if(!b){
  showMessage("¡Camina cerca de una casa o lugar para descubrirlo!");
  return;
 }
 if(b.type==="home")showMessage("🏡 ¡Bienvenido a tu casa! Aquí puedes descansar y decorar.");
 if(b.type==="shop"){
  stars>=3?(stars-=3,showMessage("🎁 ¡Compraste un accesorio! ¡Muy bien!")):
  showMessage("⭐ ¡Consigue 3 estrellas jugando para comprar!");
  updateStars();
 }
 if(b.type==="park"||b.type==="play")showMessage("🛝 ¡Qué divertido! Explora el parque.");
 if(b.type==="animals")startActivity("animals");
 if(b.type==="school")startActivity("numbers");
 if(b.type==="letters")startActivity("letters");
}

function showMessage(txt){
 let m=document.getElementById("message");
 m.textContent=txt;
 m.style.display="block";
 setTimeout(()=>m.style.display="none",3000);
}

const activities={
 animals:[
  ["¿Qué animal dice MIAU?",["🐱 GATO","🐶 PERRO","🐮 VACA"],"🐱 GATO"],
  ["¿Quién tiene una trompa?",["🐘 ELEFANTE","🐰 CONEJO","🐔 GALLINA"],"🐘 ELEFANTE"],
  ["¿Qué animal vive en el agua?",["🐟 PEZ","🐵 MONO","🐴 CABALLO"],"🐟 PEZ"]
 ],
 numbers:[
  ["¿Cuánto es 1 + 1?",["1","2","3"],"2"],
  ["¿Cuánto es 2 + 1?",["2","3","4"],"3"],
  ["¿Qué número viene después del 4?",["3","5","7"],"5"]
 ],
 letters:[
  ["¿Con qué letra empieza OSO?",["O","S","M"],"O"],
  ["¿Con qué letra empieza LUNA?",["L","A","U"],"L"],
  ["¿Con qué letra empieza SOL?",["S","L","A"],"S"]
 ]
};

let taskList=[];
let taskIndex=0;

function startActivity(type){
 taskList=activities[type];
 taskIndex=0;
 activityOpen=true;
 document.getElementById("activity").classList.remove("hidden");
 showTask();
}

function showTask(){
 let q=taskList[taskIndex];
 if(!q){
  document.getElementById("activityTitle").textContent="🎉 ¡FELICIDADES!";
  document.getElementById("activityQuestion").textContent="¡Terminaste la actividad!";
  document.getElementById("activityAnswers").innerHTML="";
  document.getElementById("activityMessage").textContent="Ganaste una estrella ⭐";
  stars++;
  updateStars();
  speak("Felicidades. Lo hiciste muy bien.");
  return;
 }

 document.getElementById("activityTitle").textContent="✨ ¡Aprendamos juntos!";
 document.getElementById("activityQuestion").textContent=q[0];
 document.getElementById("activityMessage").textContent="";
 let box=document.getElementById("activityAnswers");
 box.innerHTML="";
 q[1].forEach(a=>{
  let btn=document.createElement("button");
  btn.textContent=a;
  btn.onclick=()=>answer(a);
  box.appendChild(btn);
 });
}

function answer(a){
 let q=taskList[taskIndex];
 if(a===q[2]){
  document.getElementById("activityMessage").textContent="🌟 ¡MUY BIEN!";
  speak("Muy bien. Excelente.");
  taskIndex++;
  setTimeout(showTask,1100);
 }else{
  document.getElementById("activityMessage").textContent="💗 ¡Inténtalo otra vez!";
  speak("Inténtalo otra vez.");
 }
}

function closeActivity(){
 activityOpen=false;
 document.getElementById("activity").classList.add("hidden");
}

function openWardrobe(){
 document.getElementById("wardrobe").classList.remove("hidden");
}
function closeWardrobe(){
 document.getElementById("wardrobe").classList.add("hidden");
}
function setCharacter(v){
 player.face=v;
 document.getElementById("preview").textContent=v;
}
function setClothes(v){
 player.clothes=v;
}
function setHair(v){
 player.hair=v;
}
function setAccessory(v){
 player.accessory=v;
}
function saveAvatar(){
 localStorage.setItem("virtualAvatar",JSON.stringify(player));
 showMessage("💖 ¡Tu personaje está guardado!");
}
function updateStars(){
 document.getElementById("stars").textContent=stars;
}
function speak(txt){
 if("speechSynthesis" in window){
  speechSynthesis.cancel();
  let s=new SpeechSynthesisUtterance(txt);
  s.lang="es-MX";
  speechSynthesis.speak(s);
 }
}

function loadAvatar(){
 try{
  let saved=localStorage.getItem("virtualAvatar");
  if(saved)player=Object.assign(player,JSON.parse(saved));
  document.getElementById("preview").textContent=player.face;
 }catch(e){}
}

loadAvatar();
loopMovement();
draw();
</script>

</body>
</html>
